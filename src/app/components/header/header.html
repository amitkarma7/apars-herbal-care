<header class="site-header" [class.open]="menuOpen()">
  <div class="container bar">
    <a class="wordmark" href="#home" (click)="close()" aria-label="Apars Herbal Care, back to top">
      <svg class="sprig" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M16 29V9" />
        <path d="M16 20c-5 0-9-3-10-8c5 0 9 3 10 8zM16 15c5 0 9-3 10-8c-5 0-9 3-10 8zM16 10c-2-3-2-6 0-8c2 2 2 5 0 8z" />
      </svg>
      <span class="mark">
        <span class="mark-name">APARS</span>
        <span class="mark-sub">Herbal Care</span>
      </span>
    </a>

    <nav class="nav" id="site-nav" aria-label="Main">
      <ul>
        @for (link of links; track link.fragment) {
          <li>
            <a [href]="'#' + link.fragment" (click)="close()">{{ link.label }}</a>
          </li>
        }
      </ul>
      <a class="btn btn-primary nav-cta" href="#order" (click)="close()">Order Now</a>
    </nav>

    <button
      type="button"
      class="menu-toggle"
      aria-controls="site-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggle()"
    >
      <span class="visually-hidden">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
      <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
  </div>
</header>
